<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DemiA Support</title>
  <meta name="robots" content="noindex" />
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; line-height: 1.55; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 40px 20px; }
    .card { border: 1px solid rgba(127,127,127,.25); border-radius: 14px; padding: 22px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 10px 0; }
    a { color: inherit; }
    .muted { opacity: .75; font-size: 14px; }
    .kv { margin-top: 14px; }
    .kv div { margin: 6px 0; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(127,127,127,.25); font-size: 12px; opacity: .9; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <span class="badge">Support</span>
      <h1>DemiA Support</h1>
      <p>If you have any questions or need assistance while using DemiA, please contact us using the information below.</p>

      <div class="kv">
        <div><strong>Email:</strong> <a href="mailto:demia-support@lkinv.com">demia-support@lkinv.com</a></div>
        <div><strong>Response time:</strong> within 1–2 business days</div>
      </div>

      <p class="muted">LK INVENTION CO., LTD.</p>
    </div>
  </main>
</body>
</html>
